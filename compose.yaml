services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fincore-app

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    depends_on:
      - mysql
      - redis
      - rabbitmq

    networks:
      - fincore


  nginx:
    image: nginx:1.31-alpine

    container_name: fincore-nginx

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - fincore


  mysql:
    image: mysql:8.4

    container_name: fincore-mysql

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fincore}
      MYSQL_USER: ${DB_USERNAME:-fincore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fincore_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - fincore


  redis:
    image: redis:8-alpine

    container_name: fincore-redis

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - fincore


  rabbitmq:
    image: rabbitmq:4-management-alpine

    container_name: fincore-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fincore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fincore_dev}

    ports:
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - fincore


networks:
  fincore:


volumes:
  mysql_data:
  redis_data:
  rabbitmq_data: